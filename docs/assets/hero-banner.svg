<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EFF8A"/>
      <stop offset="1" stop-color="#5AA9FF"/>
    </linearGradient>
    <style>
      .dim{ fill:#8a8a8a; }
      .txt{ fill:#e8e8e8; }
      .tag-text{ font-size:10px; font-weight:700; letter-spacing:.08em; fill:#0a0a0a; }
      .card-label{ font-size:9px; font-weight:700; letter-spacing:.14em; fill:#8a8a8a; }
    </style>
  </defs>

  <!-- app shell -->
  <rect x="8" y="8" width="944" height="284" rx="24" fill="#0a0a0a" stroke="#242424" stroke-width="1.5"/>

  <!-- header: brand mark + name -->
  <rect x="32" y="28" width="30" height="30" rx="8" fill="url(#brandGrad)"/>
  <text x="47" y="49" text-anchor="middle" font-size="13" font-weight="800" fill="#0a0a0a">DV</text>
  <text x="72" y="49" font-size="16" font-weight="700" class="txt">Discuss with <tspan fill="#5EFF8A">VoiceAI</tspan></text>

  <!-- LIVE pill, top right -->
  <rect x="826" y="26" width="94" height="27" rx="13.5" fill="none" stroke="#242424"/>
  <circle cx="845" cy="39.5" r="4" fill="#5EFF8A">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="858" y="43.5" font-size="10" font-weight="700" letter-spacing=".12em" fill="#8a8a8a">LIVE</text>

  <!-- radar pings around the topic hub (the "always listening" cue) -->
  <circle cx="480" cy="185" r="46" fill="none" stroke="#5EFF8A" stroke-width="2">
    <animate attributeName="r" values="46;82" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="185" r="46" fill="none" stroke="#5EFF8A" stroke-width="2">
    <animate attributeName="r" values="46;82" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- slow-rotating dashed orbit ring -->
  <circle cx="480" cy="185" r="92" fill="none" stroke="#242424" stroke-width="1.4" stroke-dasharray="3 6">
    <animateTransform attributeName="transform" type="rotate" from="0 480 185" to="360 480 185" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="185" r="62" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- four topic tags orbiting the hub, upright the whole way round -->
  <g>
    <rect x="-30" y="-11" width="60" height="22" rx="11" fill="#5EFF8A"/>
    <text x="0" y="4" text-anchor="middle" class="tag-text">SPACE</text>
    <animateMotion dur="18s" begin="0s" repeatCount="indefinite" path="M480,93 A92,92 0 1,1 480,277 A92,92 0 1,1 480,93"/>
  </g>
  <g>
    <rect x="-46" y="-11" width="92" height="22" rx="11" fill="#5AA9FF"/>
    <text x="0" y="4" text-anchor="middle" class="tag-text">PHILOSOPHY</text>
    <animateMotion dur="18s" begin="-4.5s" repeatCount="indefinite" path="M480,93 A92,92 0 1,1 480,277 A92,92 0 1,1 480,93"/>
  </g>
  <g>
    <rect x="-38" y="-11" width="76" height="22" rx="11" fill="#FF6EAD"/>
    <text x="0" y="4" text-anchor="middle" class="tag-text">CRICKET</text>
    <animateMotion dur="18s" begin="-9s" repeatCount="indefinite" path="M480,93 A92,92 0 1,1 480,277 A92,92 0 1,1 480,93"/>
  </g>
  <g>
    <rect x="-22" y="-11" width="44" height="22" rx="11" fill="#D9A857"/>
    <text x="0" y="4" text-anchor="middle" class="tag-text">AI</text>
    <animateMotion dur="18s" begin="-13.5s" repeatCount="indefinite" path="M480,93 A92,92 0 1,1 480,277 A92,92 0 1,1 480,93"/>
  </g>

  <!-- center hub -->
  <circle cx="480" cy="185" r="46" fill="#121212" stroke="#5EFF8A" stroke-width="1.5"/>
  <text x="480" y="180" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing=".16em" class="dim">TOPIC</text>
  <text x="480" y="197" text-anchor="middle" font-size="14" font-weight="700" class="txt">Any Topic</text>

  <!-- YOU card, waveform bars react like the real mic input -->
  <g>
    <rect x="50" y="140" width="150" height="90" rx="14" fill="#171717" stroke="#242424"/>
    <circle cx="66" cy="158" r="3" fill="#5EFF8A"/>
    <text x="76" y="161" class="card-label">YOU</text>
    <g fill="#5EFF8A">
      <rect x="70" y="195" width="7" height="10" rx="3">
        <animate attributeName="height" values="10;28;14;22;10" dur="1.1s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="y" values="195;177;191;183;195" dur="1.1s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="88" y="187" width="7" height="18" rx="3">
        <animate attributeName="height" values="18;8;26;12;18" dur="1.1s" begin="0.12s" repeatCount="indefinite"/>
        <animate attributeName="y" values="187;197;179;193;187" dur="1.1s" begin="0.12s" repeatCount="indefinite"/>
      </rect>
      <rect x="106" y="181" width="7" height="24" rx="3">
        <animate attributeName="height" values="24;12;30;16;24" dur="1.1s" begin="0.24s" repeatCount="indefinite"/>
        <animate attributeName="y" values="181;193;175;189;181" dur="1.1s" begin="0.24s" repeatCount="indefinite"/>
      </rect>
      <rect x="124" y="191" width="7" height="14" rx="3">
        <animate attributeName="height" values="14;26;10;20;14" dur="1.1s" begin="0.36s" repeatCount="indefinite"/>
        <animate attributeName="y" values="191;179;195;185;191" dur="1.1s" begin="0.36s" repeatCount="indefinite"/>
      </rect>
      <rect x="142" y="197" width="7" height="8" rx="3">
        <animate attributeName="height" values="8;20;12;24;8" dur="1.1s" begin="0.48s" repeatCount="indefinite"/>
        <animate attributeName="y" values="197;185;193;181;197" dur="1.1s" begin="0.48s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- COMPANION card, its own independent waveform -->
  <g>
    <rect x="760" y="140" width="150" height="90" rx="14" fill="#171717" stroke="#242424"/>
    <circle cx="776" cy="158" r="3" fill="#FF6EAD"/>
    <text x="786" y="161" class="card-label">COMPANION</text>
    <g fill="#FF6EAD">
      <rect x="780" y="191" width="7" height="14" rx="3">
        <animate attributeName="height" values="14;24;9;27;14" dur="1.3s" begin="0.05s" repeatCount="indefinite"/>
        <animate attributeName="y" values="191;181;196;178;191" dur="1.3s" begin="0.05s" repeatCount="indefinite"/>
      </rect>
      <rect x="798" y="183" width="7" height="22" rx="3">
        <animate attributeName="height" values="22;10;28;16;22" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="183;195;177;189;183" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="816" y="177" width="7" height="28" rx="3">
        <animate attributeName="height" values="28;14;30;18;28" dur="1.3s" begin="0.35s" repeatCount="indefinite"/>
        <animate attributeName="y" values="177;191;175;187;177" dur="1.3s" begin="0.35s" repeatCount="indefinite"/>
      </rect>
      <rect x="834" y="189" width="7" height="16" rx="3">
        <animate attributeName="height" values="16;26;11;23;16" dur="1.3s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="189;179;194;182;189" dur="1.3s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="852" y="195" width="7" height="10" rx="3">
        <animate attributeName="height" values="10;22;13;25;10" dur="1.3s" begin="0.65s" repeatCount="indefinite"/>
        <animate attributeName="y" values="195;183;192;180;195" dur="1.3s" begin="0.65s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- tagline -->
  <text x="480" y="270" text-anchor="middle" font-size="11" letter-spacing=".08em" class="dim">ANY TOPIC &#183; DISCUSSED &#183; EXPLAINED &#183; DEBATED</text>
</svg>
